<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111111" />
    <title>Locked</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      form { display: flex; flex-direction: column; gap: 12px; width: min(300px, 80vw); }
      input, button { padding: 12px; border-radius: 10px; font-size: 16px; }
      input { border: 1px solid #333; background: #1b1b1b; color: #eee; }
      button { border: 0; background: #ddd; color: #111; font-weight: 600; }
      p { margin: 0; min-height: 1.4em; font-size: 13px; color: #888; text-align: center; }
      form[hidden] { display: none; }
    </style>
  </head>
  <body>
    <form id="unlock" hidden>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
      <button type="submit">Unlock</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <script src="loader.js"></script>
  </body>
</html>
